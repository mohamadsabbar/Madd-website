# Internal app Nginx — listens inside Docker only.
# Host binds 127.0.0.1:8080 → this container :80
# DO NOT bind host 80/443 here.

upstream madd_php {
    server php:9000;
}

# Marketing site + public API + subscriber login
server {
    listen 80;
    server_name madd.ps www.madd.ps;
    client_max_body_size 32m;

    # React build
    root /var/www/site;
    index index.html;

    # Laravel health
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/portal/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass madd_php;
    }

    # Site CMS API + customer API
    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/portal/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass madd_php;
    }

    # Subscriber portal + staff login (Laravel)
    location ^~ /my {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/portal/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass madd_php;
    }

    location = /login {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/portal/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass madd_php;
    }

    location = /logout {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/portal/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass madd_php;
    }

    location ^~ /agent {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/portal/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass madd_php;
    }

    # Laravel public assets (if any under /build, /vendor)
    location ^~ /storage {
        alias /var/www/portal/public/storage;
        try_files $uri $uri/ =404;
    }

    # SPA — React owns /admin (CMS). ISP panel uses panel.madd.ps
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ISP / MikroTik admin panel (Laravel) — future + current staff URLs
server {
    listen 80;
    server_name panel.madd.ps;
    client_max_body_size 32m;

    root /var/www/portal/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass madd_php;
    }

    location ^~ /storage {
        alias /var/www/portal/public/storage;
        try_files $uri $uri/ =404;
    }
}

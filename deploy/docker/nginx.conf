# Internal app Nginx — listens inside Docker only.
# Host binds 127.0.0.1:8080 → this container :80
# DO NOT bind host 80/443 here.

upstream madd_php {
    server php:9000;
}

# Marketing site (React) + site CMS API only
server {
    listen 80;
    server_name madd.ps www.madd.ps;
    client_max_body_size 32m;

    root /var/www/site;
    index index.html;

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/portal/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass madd_php;
    }

    # Site CMS API for the marketing React app (same-origin /api/site/*)
    location ^~ /api/site {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/portal/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass madd_php;
    }

    # Old portal paths → my.madd.ps
    location ^~ /my {
        return 301 https://my.madd.ps$request_uri;
    }

    location = /login {
        return 301 https://my.madd.ps/login;
    }

    location = /logout {
        return 301 https://my.madd.ps/logout;
    }

    location ^~ /agent {
        return 301 https://my.madd.ps$request_uri;
    }

    location ^~ /admin/dashboard {
        return 301 https://my.madd.ps$request_uri;
    }

    # SPA — React owns /admin (site CMS)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Customer + agent + staff portal + mobile API (Laravel)
server {
    listen 80;
    server_name my.madd.ps;
    client_max_body_size 32m;

    root /var/www/portal/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass madd_php;
    }

    location ^~ /storage {
        alias /var/www/portal/public/storage;
        try_files $uri $uri/ =404;
    }
}


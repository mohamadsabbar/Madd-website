# Host Nginx (owns :80 / :443) — MADD website
# Place in: /etc/nginx/sites-available/madd.ps
# Then: ln -s /etc/nginx/sites-available/madd.ps /etc/nginx/sites-enabled/
#
# Upstream is Docker app bound to 127.0.0.1:8080 ONLY.
# Do NOT change UISP / GenieACS server blocks.

# Cloudflare real IP (IPv4 — update periodically from Cloudflare docs)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

upstream madd_website {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name madd.ps www.madd.ps;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://madd.ps$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.madd.ps;

    # Certificates: Cloudflare Origin Cert OR Let's Encrypt
    ssl_certificate     /etc/nginx/ssl/madd-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/madd-origin.key;

    return 301 https://madd.ps$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name madd.ps;

    ssl_certificate     /etc/nginx/ssl/madd-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/madd-origin.key;

    # Security headers (Cloudflare may also set some)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 32m;

    location / {
        proxy_pass http://madd_website;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}

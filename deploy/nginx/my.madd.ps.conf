# Host Nginx — customer / agent / staff portal + API
# Place in: /etc/nginx/sites-available/my.madd.ps
# DNS: my.madd.ps → Cloudflare (orange) → same origin IP as madd.ps
#
# Upstream shares Docker app on 127.0.0.1:8080 (Host header selects vhost).

upstream madd_website_my {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name my.madd.ps;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://my.madd.ps$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name my.madd.ps;

    # Same Cloudflare Origin cert as madd.ps (must include my.madd.ps in SANs)
    # or use a wildcard *.madd.ps Origin certificate.
    ssl_certificate     /etc/nginx/ssl/madd-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/madd-origin.key;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 32m;

    location / {
        proxy_pass http://madd_website_my;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}

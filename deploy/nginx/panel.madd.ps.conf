# Host Nginx — ISP panel (Laravel)
# Optional now; recommended so /admin on madd.ps stays React CMS.
#
# Place in: /etc/nginx/sites-available/panel.madd.ps
# DNS: panel.madd.ps → same Cloudflare → 84.242.50.172

upstream madd_website_panel {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.madd.ps;
    return 301 https://panel.madd.ps$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.madd.ps;

    ssl_certificate     /etc/ssl/madd/madd.ps.pem;
    ssl_certificate_key /etc/ssl/madd/madd.ps.key;

    client_max_body_size 32m;

    location / {
        proxy_pass http://madd_website_panel;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}
